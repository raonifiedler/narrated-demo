[project]
name = "narrated-demo"
version = "0.1.0"
description = "Vídeos de demonstração de software feitos pela IA: roteiro, gravação, narração local e montagem (PT-BR)."
requires-python = ">=3.12"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "numpy>=2.0",
    "piper-tts>=1.8.0",
    "playwright>=1.65.2",
    "pydantic>=2.9",
    "soundfile>=0.13",
]

[project.optional-dependencies]
# legenda conferida pela transcrição local (o modelo é baixado do Hugging Face só com --baixar)
whisper = ["faster-whisper>=1.2.1"]
# rota desktop com mouse real (Windows): gestos + localizar elementos
desktop = ["pyautogui>=0.9.54", "pywinauto>=0.6.9; sys_platform == 'win32'"]
# exemplo da rota desktop offscreen (motor de roteiro dentro de um app Qt)
offscreen = ["pyside6-essentials>=6.8"]

[project.scripts]
vdia = "vdia.cli:main"
narrated-demo = "vdia.cli:main"

[dependency-groups]
dev = ["basedpyright>=1.20", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vdia"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]  # texto em português; exceções se chamam Erro*

[tool.basedpyright]
include = ["vdia", "tests", "exemplos"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# bibliotecas de terceiros sem tipos (piper, kokoro, pyautogui, faster-whisper) entram por adaptadores
# finos em vdia/; lá o valor desconhecido é convertido para um tipo nosso na fronteira.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: síntese de voz ou ffmpeg (segundos)"]
